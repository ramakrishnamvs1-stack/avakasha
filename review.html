<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Avakasha review</title>
<style>
:root{--bg:#f2f5f7;--s:#fff;--ink:#15232c;--mu:#556772;--ln:#d6dfe5;--ac:#0d6e6e;--bad:#9f2a20;--warn:#80470a;--wb:#fcebd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 4px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--s);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,33,43,.1)}
.c h3{margin:0 0 2px;font-size:16.5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button{font:600 14px inherit;font-family:inherit;border:1px solid var(--ln);background:var(--s);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--bad)}
input{font:inherit;border:1px solid var(--ln);border-radius:8px;padding:8px;width:84px}input.w{width:100%}
label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.t{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:#e4eaee;margin-right:4px}.t.w{background:var(--wb);color:var(--warn)}
button.tb{border-radius:999px;min-height:40px;padding:8px 14px}button.tb.on{background:var(--ac);border-color:var(--ac);color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
ul{margin:8px 0 0;padding-left:18px}li{margin:2px 0}a{color:var(--ac)}
.err{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<h1>Review</h1>
<p class="mu">New finds from the daily search wait here. Nothing reaches users until you approve it. Check each against its notice link, fix any number, then approve or reject.</p>
<div id="login" class="c"><label>Admin key<input class="w" id="key" type="password" autocomplete="off"></label><div class="row"><button class="p" id="go" type="button">Open</button></div><div id="lerr" class="err"></div></div>
<div id="main" hidden>
  <div class="row"><button id="run" type="button">Search now</button><button id="reload" type="button">Reload</button><span class="mu" id="info"></span></div>
  <div id="msg" class="mu"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>
<script>
var URLW='https://avakasha-reader.ramakrishnamvs1.workers.dev/', KEY='';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function api(a){var r=await fetch(URLW,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:Object.assign({key:KEY},a)})});var j=null;try{j=await r.json()}catch(e){}if(!r.ok||!j){var er=new Error((j&&j.error)||'failed');er.detail=j&&(j.stop||j.status||j.tail)?JSON.stringify({stop:j.stop,status:j.status,len:j.len,tail:j.tail}):'';throw er}return j}
var DRAFT=[],TAB='g',LASTJ=null;try{TAB=sessionStorage.getItem('rt')||'g'}catch(e){}
function ruleText(r){if(r.t==='age')return null;if(r.t==='passed')return 'Class 10 pass';if(r.t==='passed12')return 'Class 12 pass';if(r.t==='pct12')return 'At least '+r.min+'% in Class 12';if(r.t==='pctmin')return 'At least '+r.min+'% in Class 10';if(r.t==='exp')return r.min+' years of experience';if(r.t==='static')return r.title+': '+r.detail;return r.t}
function card(x,i){
  var h='<div class="c" data-i="'+i+'"><h3>'+esc(x.title)+'</h3><div class="mu">'+esc(x.org)+'</div><div class="row"><span class="t '+(x.official?'':'w')+'">'+(x.k==='pvt'?'Private job · '+esc(x.via||'')+' · never pay to get a job':x.lead?'Lead: official notice not found':x.official?'Official site':'Not an official site')+'</span><span class="t">'+(x.k==='exam'?'Exam':'Job')+'</span></div><p>'+esc(x.line)+'</p>';
  if(x.lead)h+='<label>Official notice link (gov.in, nic.in, ibps.in, ac.in or edu.in)<input class="w" data-f="olink" type="url" placeholder="https://..."></label>';
  if(x.k==='pvt'){h+='<div class="row"><label>Apply by<input data-f="closes" type="date" value="'+esc(x.closes||'')+'"></label><label>Years needed<input data-f="minExp" type="number" value="'+esc(x.minExp||0)+'"></label><label>Qualification<select data-f="edu">'+[['','Not stated'],['10','Class 10'],['12','Class 12'],['diploma','Diploma or ITI'],['degree','Degree'],['pg','Master\'s']].map(function(o){return '<option value="'+o[0]+'"'+((x.edu||'')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label></div><p class="mu">Where: '+esc(x.place||'')+'</p>'}
  else if(x.k==='exam'){h+='<div class="row"><label>Exam date<input data-f="d" type="date" value="'+esc(x.d)+'"></label></div>'}
  else{
    var age=(x.rules||[]).filter(function(r){return r.t==='age'})[0]||{};
    h+='<div class="row"><label>Closes<input data-f="closes" type="date" value="'+esc(x.closes||'')+'"></label><label>Age from<input data-f="amin" type="number" value="'+esc(age.min==null?'':age.min)+'"></label><label>Age to<input data-f="amax" type="number" value="'+esc(age.max==null?'':age.max)+'"></label><label>OBC to<input data-f="aobc" type="number" value="'+esc((age.maxByCat||{}).OBC==null?'':age.maxByCat.OBC)+'"></label><label>SC/ST to<input data-f="asc" type="number" value="'+esc((age.maxByCat||{}).SC==null?'':age.maxByCat.SC)+'"></label></div>';
    h+='<ul>'+(x.rules||[]).map(ruleText).filter(Boolean).map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  }
  h+='<ul>'+(x.facts||[]).map(function(f){return '<li><b>'+esc(f[0])+':</b> '+esc(f[1])+'</li>'}).join('')+'</ul>';
  h+='<p class="mu">'+esc(x.cyc||'')+'</p><p><a href="'+esc(x.src[1])+'" target="_blank" rel="noopener">'+(x.lead?'Where it was seen: ':'Open the notice: ')+esc(x.src[0])+'</a></p><div class="row"><button class="p" data-a="ok">Approve</button><button class="d" data-a="no">Reject</button></div></div>';
  return h}
function collect(i){
  var x=JSON.parse(JSON.stringify(DRAFT[i])),el=document.querySelector('[data-i="'+i+'"]');
  function v(f){var e=el.querySelector('[data-f="'+f+'"]');return e?e.value:''}
  if(x.lead){var ol=v('olink').trim();if(!/^https:\/\/([a-z0-9-]+\.)*(gov\.in|nic\.in|ibps\.in|ac\.in|edu\.in)(\/|$)/i.test(ol)){alert('Paste the official notice link first (it must be on gov.in, nic.in, ibps.in, ac.in or edu.in).');return null}x.src=['Official notice',ol]}
  if(x.k==='pvt'){x.closes=v('closes')||null;x.minExp=parseFloat(v('minExp'))||0;x.edu=v('edu')||null;return x}
  if(x.k==='exam'){x.d=v('d');x.when=x.d;return x}
  x.closes=v('closes')||null;if(!x.closes){x.stat={k:'unk',t:'Dates not confirmed'}}else{delete x.stat}
  var age=x.rules.filter(function(r){return r.t==='age'})[0];
  var mn=parseFloat(v('amin')),mx=parseFloat(v('amax')),ob=parseFloat(v('aobc')),sc=parseFloat(v('asc'));
  x.rules=x.rules.filter(function(r){return r.t!=='age'&&!(r.t==='static'&&r.title==='Age limit')});
  if(!isNaN(mn)){var a={t:'age',min:mn,relax:1};if(!isNaN(mx))a.max=mx;var m={};if(!isNaN(ob))m.OBC=ob;if(!isNaN(sc)){m.SC=sc;m.ST=sc}if(Object.keys(m).length)a.maxByCat=m;x.rules.unshift(a)}
  return x}
function draw(j){
  LASTJ=j;
  DRAFT=(j.draft&&j.draft.items)||[];
  $('info').textContent=j.draft&&j.draft.at?'Last search '+new Date(j.draft.at).toLocaleString():'No search yet';
  var main=[],leads=[],pv=[];DRAFT.forEach(function(x,i){(x.k==='pvt'?pv:x.lead?leads:main).push(card(x,i))});
  var l=j.live||{records:[],exams:[]},lv=l.records.concat(l.exams).concat(l.pvt||[]);
  var TABS=[['g','Govt and exams',main.length],['l','Leads',leads.length],['p','Private jobs',pv.length],['n','Live now',lv.length],['h','Run history',(j.runlog||[]).length]];
  if(!TABS.some(function(t){return t[0]===TAB}))TAB='g';
  $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" class="tb'+(t[0]===TAB?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+' ('+t[2]+')</button>'}).join('');
  var body='';
  if(TAB==='g')body=main.length?'<p class="mu">Finds from official government sites. Check each against its notice, fix any number, then approve or reject.</p>'+main.join(''):'<div class="c mu">Nothing waiting.</div>';
  else if(TAB==='l')body=leads.length?'<p class="mu">Seen on other sites, but no official notice was found. Find the notice on the official site and paste its link to approve, or reject.</p>'+leads.join(''):'<div class="c mu">No leads waiting.</div>';
  else if(TAB==='h'){var SN={A:'Official sites',B:'Other govt posts',C:'Private jobs'};body=(j.runlog||[]).length?'<p class="mu">Every search, newest first. Found is what the search returned; Added is what reached the waiting list; the rest were duplicates or dropped (fee, no link, closed). Cost is an estimate.</p>'+(j.runlog||[]).map(function(r){var d=new Date(r.at);return '<div class="c"><b>'+esc(SN[r.step]||r.step)+'</b> <span class="mu">'+d.toLocaleDateString()+' '+d.toLocaleTimeString()+' · '+(r.src==='daily'?'7:30 am auto run':'manual')+'</span><div class="mu">'+(r.ok?'Found '+(r.raw==null?'?':r.raw)+' · Added '+(r.added==null?'?':r.added)+' · Duplicates '+(r.dup||0)+' · Dropped '+(r.bad||0):'<span class="err">Failed: '+esc(r.error||'')+'</span>')+' · about ₹'+Math.round(r.inr||0)+(r.model?' · '+esc(r.model)+(r.fellBack?' (fell back)':''):'')+'</div></div>'}).join(''):'<div class="c mu">No runs recorded yet. Runs from now on will appear here.</div>'}
  else if(TAB==='p')body=pv.length?'<p class="mu">Found on job sites. Open each listing, check the employer is real and nothing asks for a fee, fix the qualification and years, then approve.</p>'+pv.join(''):'<div class="c mu">No private jobs waiting.</div>';
  else body=(lv.map(function(x){return '<div class="c"><b>'+esc(x.title)+'</b> <span class="mu">'+esc(x.closes||x.d||'')+'</span><div class="row"><button class="d" data-rm="'+esc(x.id)+'">Remove</button></div></div>'}).join(''))||'<div class="c mu">Nothing live yet.</div>';
  $('list').innerHTML=body;
  var L=j.last;$('msg').innerHTML=L?(L.ok?'Last run: '+L.n+' finds ('+(L.leads||0)+' leads).':'<span class="err">Last run failed: '+esc(L.error||'')+'</span> <span class="mu">'+esc(JSON.stringify({stop:L.stop,status:L.status,tail:L.tail}))+'</span>')+' <span class="mu">'+new Date(L.at).toLocaleString()+'</span>'+(L.usage&&L.usage.inr?' <span class="mu">Cost of the last step about ₹'+Math.round(L.usage.inr)+(L.usage.fellBack?' (cheaper model unavailable, used the main one)':'')+'.</span>':''):'';
  if(j.spend!=null)$('msg').innerHTML+=' <span class="mu">This month so far about ₹'+j.spend+' (estimate).</span>';
}
async function load(a){$('msg').textContent='Working…';try{var j=await api(a||{action:'list'});draw(j);$('msg').textContent=''}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
$('go').onclick=async function(){KEY=$('key').value;try{var j=await api({action:'list'});try{sessionStorage.setItem('ak',KEY)}catch(e){}$('login').hidden=true;$('main').hidden=false;draw(j)}catch(e){$('lerr').textContent=e.message==='forbidden'?'Wrong key.':e.message}};
$('reload').onclick=function(){load()};
$('run').onclick=async function(){if(!confirm('Run the search now? It costs roughly ₹50 to ₹75 (the real cost shows afterwards) and takes 3 to 6 minutes. Keep this page open.'))return;
  var t0=Date.now(),tick=setInterval(function(){var s=$('msg').getAttribute('data-s')||'';$('msg').textContent=s+' ('+Math.round((Date.now()-t0)/1000)+' s)'},1000);
  function st(t){$('msg').setAttribute('data-s',t);$('msg').textContent=t}
  try{st('Step 1 of 3: searching official sites…');await api({action:'run'});st('Step 2 of 3: looking for other govt posts…');await api({action:'run2'});st('Step 3 of 3: looking for private jobs…');await api({action:'run3'})}
  catch(e){clearInterval(tick);$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span> <span class="mu">'+esc(e.detail||'')+'</span>';try{draw(await api({action:'list'}))}catch(x){}return}
  clearInterval(tick);load()};
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){TAB=b.dataset.tab;try{sessionStorage.setItem('rt',TAB)}catch(x){}if(LASTJ)draw(LASTJ);return}var c=b.closest('[data-i]');
  if(b.dataset.a&&c){var i=+c.dataset.i;if(b.dataset.a==='ok'){var it=collect(i);if(it)load({action:'approve',items:[it]})}elseload({action:'reject',ids:[DRAFT[i].id]})}
  if(b.dataset.rm&&confirm('Remove from live?'))load({action:'remove',ids:[b.dataset.rm]})});
try{var k=sessionStorage.getItem('ak');if(k){$('key').value=k}}catch(e){}
</script>
</body>
</html>
