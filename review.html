<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Avakasha review</title>
<style>
:root{--bg:#f2f5f7;--s:#fff;--ink:#15232c;--mu:#556772;--ln:#d6dfe5;--ac:#0d6e6e;--bad:#9f2a20;--warn:#80470a;--wb:#fcebd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 4px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--s);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,33,43,.1)}
.c h3{margin:0 0 2px;font-size:16.5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button{font:600 14px inherit;font-family:inherit;border:1px solid var(--ln);background:var(--s);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--bad)}
input{font:inherit;border:1px solid var(--ln);border-radius:8px;padding:8px;width:84px}input.w{width:100%}
label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.t{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:#e4eaee;margin-right:4px}.t.w{background:var(--wb);color:var(--warn)}
ul{margin:8px 0 0;padding-left:18px}li{margin:2px 0}a{color:var(--ac)}
.err{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<h1>Review</h1>
<p class="mu">New finds from the daily search wait here. Nothing reaches users until you approve it. Check each against its notice link, fix any number, then approve or reject.</p>
<div id="login" class="c"><label>Admin key<input class="w" id="key" type="password" autocomplete="off"></label><div class="row"><button class="p" id="go" type="button">Open</button></div><div id="lerr" class="err"></div></div>
<div id="main" hidden>
  <div class="row"><button id="run" type="button">Search now</button><button id="reload" type="button">Reload</button><span class="mu" id="info"></span></div>
  <div id="msg" class="mu"></div>
  <div id="list"></div>
  <h1 style="margin-top:24px">Live now</h1><div id="live"></div>
</div>
<script>
var URLW='https://avakasha-reader.ramakrishnamvs1.workers.dev/', KEY='';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function api(a){var r=await fetch(URLW,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:Object.assign({key:KEY},a)})});var j=null;try{j=await r.json()}catch(e){}if(!r.ok||!j){var er=new Error((j&&j.error)||'failed');er.detail=j&&(j.stop||j.status||j.tail)?JSON.stringify({stop:j.stop,status:j.status,len:j.len,tail:j.tail}):'';throw er}return j}
var DRAFT=[];
function ruleText(r){if(r.t==='age')return null;if(r.t==='passed')return 'Class 10 pass';if(r.t==='passed12')return 'Class 12 pass';if(r.t==='pct12')return 'At least '+r.min+'% in Class 12';if(r.t==='pctmin')return 'At least '+r.min+'% in Class 10';if(r.t==='exp')return r.min+' years of experience';if(r.t==='static')return r.title+': '+r.detail;return r.t}
function card(x,i){
  var h='<div class="c" data-i="'+i+'"><h3>'+esc(x.title)+'</h3><div class="mu">'+esc(x.org)+'</div><div class="row"><span class="t '+(x.official?'':'w')+'">'+(x.lead?'Lead: official notice not found':x.official?'Official site':'Not an official site')+'</span><span class="t">'+(x.k==='exam'?'Exam':'Job')+'</span></div><p>'+esc(x.line)+'</p>';
  if(x.lead)h+='<label>Official notice link (gov.in, nic.in, ibps.in, ac.in or edu.in)<input class="w" data-f="olink" type="url" placeholder="https://..."></label>';
  if(x.k==='exam'){h+='<div class="row"><label>Exam date<input data-f="d" type="date" value="'+esc(x.d)+'"></label></div>'}
  else{
    var age=(x.rules||[]).filter(function(r){return r.t==='age'})[0]||{};
    h+='<div class="row"><label>Closes<input data-f="closes" type="date" value="'+esc(x.closes||'')+'"></label><label>Age from<input data-f="amin" type="number" value="'+esc(age.min==null?'':age.min)+'"></label><label>Age to<input data-f="amax" type="number" value="'+esc(age.max==null?'':age.max)+'"></label><label>OBC to<input data-f="aobc" type="number" value="'+esc((age.maxByCat||{}).OBC==null?'':age.maxByCat.OBC)+'"></label><label>SC/ST to<input data-f="asc" type="number" value="'+esc((age.maxByCat||{}).SC==null?'':age.maxByCat.SC)+'"></label></div>';
    h+='<ul>'+(x.rules||[]).map(ruleText).filter(Boolean).map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  }
  h+='<ul>'+(x.facts||[]).map(function(f){return '<li><b>'+esc(f[0])+':</b> '+esc(f[1])+'</li>'}).join('')+'</ul>';
  h+='<p class="mu">'+esc(x.cyc||'')+'</p><p><a href="'+esc(x.src[1])+'" target="_blank" rel="noopener">'+(x.lead?'Where it was seen: ':'Open the notice: ')+esc(x.src[0])+'</a></p><div class="row"><button class="p" data-a="ok">Approve</button><button class="d" data-a="no">Reject</button></div></div>';
  return h}
function collect(i){
  var x=JSON.parse(JSON.stringify(DRAFT[i])),el=document.querySelector('[data-i="'+i+'"]');
  function v(f){var e=el.querySelector('[data-f="'+f+'"]');return e?e.value:''}
  if(x.lead){var ol=v('olink').trim();if(!/^https:\/\/([a-z0-9-]+\.)*(gov\.in|nic\.in|ibps\.in|ac\.in|edu\.in)(\/|$)/i.test(ol)){alert('Paste the official notice link first (it must be on gov.in, nic.in, ibps.in, ac.in or edu.in).');return null}x.src=['Official notice',ol]}
  if(x.k==='exam'){x.d=v('d');x.when=x.d;return x}
  x.closes=v('closes')||null;if(!x.closes){x.stat={k:'unk',t:'Dates not confirmed'}}else{delete x.stat}
  var age=x.rules.filter(function(r){return r.t==='age'})[0];
  var mn=parseFloat(v('amin')),mx=parseFloat(v('amax')),ob=parseFloat(v('aobc')),sc=parseFloat(v('asc'));
  x.rules=x.rules.filter(function(r){return r.t!=='age'&&!(r.t==='static'&&r.title==='Age limit')});
  if(!isNaN(mn)){var a={t:'age',min:mn,relax:1};if(!isNaN(mx))a.max=mx;var m={};if(!isNaN(ob))m.OBC=ob;if(!isNaN(sc)){m.SC=sc;m.ST=sc}if(Object.keys(m).length)a.maxByCat=m;x.rules.unshift(a)}
  return x}
function draw(j){
  DRAFT=(j.draft&&j.draft.items)||[];
  $('info').textContent=j.draft&&j.draft.at?'Last search '+new Date(j.draft.at).toLocaleString():'No search yet';
  var main=[],leads=[];DRAFT.forEach(function(x,i){(x.lead?leads:main).push(card(x,i))});
  $('list').innerHTML=(main.length?main.join(''):'<div class="c mu">Nothing waiting.</div>')+(leads.length?'<h1 style="margin-top:24px">Leads</h1><p class="mu">Seen on other sites, but no official notice was found. Find the notice on the official site and paste its link to approve, or reject.</p>'+leads.join(''):'');
  var L=j.last;$('msg').innerHTML=L?(L.ok?'Last run: '+L.n+' finds ('+(L.leads||0)+' leads).':'<span class="err">Last run failed: '+esc(L.error||'')+'</span> <span class="mu">'+esc(JSON.stringify({stop:L.stop,status:L.status,tail:L.tail}))+'</span>')+' <span class="mu">'+new Date(L.at).toLocaleString()+'</span>':'';
  var l=j.live||{records:[],exams:[]};
  $('live').innerHTML=(l.records.concat(l.exams).map(function(x){return '<div class="c"><b>'+esc(x.title)+'</b> <span class="mu">'+esc(x.closes||x.d||'')+'</span><div class="row"><button class="d" data-rm="'+esc(x.id)+'">Remove</button></div></div>'}).join(''))||'<div class="c mu">Nothing live yet.</div>';
}
async function load(a){$('msg').textContent='Working…';try{var j=await api(a||{action:'list'});draw(j);$('msg').textContent=''}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
$('go').onclick=async function(){KEY=$('key').value;try{var j=await api({action:'list'});try{sessionStorage.setItem('ak',KEY)}catch(e){}$('login').hidden=true;$('main').hidden=false;draw(j)}catch(e){$('lerr').textContent=e.message==='forbidden'?'Wrong key.':e.message}};
$('reload').onclick=function(){load()};
$('run').onclick=async function(){if(!confirm('Run the search now? It costs about ₹40 to ₹50.'))return;$('msg').textContent='Searching. This takes 2 to 4 minutes. You can leave this page open…';try{await api({action:'run'});var t0=Date.now();(function poll(){setTimeout(async function(){try{var j=await api({action:'list'});if(j.running&&Date.now()-t0<9e5){$('msg').textContent='Still searching… ('+Math.round((Date.now()-t0)/1000)+' s)';poll()}else draw(j)}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}},10000)})()}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span> <span class="mu">'+esc(e.detail||'')+'</span>'}};
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.closest('[data-i]');
  if(b.dataset.a&&c){var i=+c.dataset.i;if(b.dataset.a==='ok'){var it=collect(i);if(it)load({action:'approve',items:[it]})}elseload({action:'reject',ids:[DRAFT[i].id]})}
  if(b.dataset.rm&&confirm('Remove from live?'))load({action:'remove',ids:[b.dataset.rm]})});
try{var k=sessionStorage.getItem('ak');if(k){$('key').value=k}}catch(e){}
</script>
</body>
</html>
